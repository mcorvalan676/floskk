[project]
name = "conectatalento"
version = "0.1.0"
description = "Plataforma de reclutamiento Flask desplegada en Cloudflare Workers."
requires-python = ">=3.13"
dependencies = [
    "Flask>=3.1,<4",
    "PyMySQL>=1.1,<2",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.0,<2",
    "workers-py",
    "workers-runtime-sdk",
]
