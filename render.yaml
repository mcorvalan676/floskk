services:
  - type: web
    name: conectatalento
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements-hosted.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: USE_SQLITE
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: conectatalento
      - key: CV_STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
